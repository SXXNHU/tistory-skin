<!-- ============================================================
  📁 SECTION : 네비게이션 바 (상단 / 하단 / 스크롤 인디케이터)
  📌 FILE    : src/html/09_navigation.html
  📋 DEPLOY  : skin.html → 사이드바(aside#sidebar) 아래
               /div(#index 닫기) + s_t3 닫기 태그 까지 포함
  📝 NOTES   : ① #indicator  — 스크롤 진행 바 (상단 고정, z-[100])
               ② #top        — 상단 툴바 (프로필 이미지 / 페이지 타이틀 / 구독 버튼)
                               온보딩 활성 시 메가메뉴 항목 표시 (CSS로 전환)
               ③ #bottom     — 하단 우측 (다크모드 토글, 상단 이동 버튼)
============================================================ -->        <aside class="fixed top-0 w-full z-[100]" id="indicator" @scroll.window="$store.indicator.indicate">
          <div class="bar w-0 h-0.5 rounded bg-h-800 dark:bg-h-200" :style='{ width: $store.indicator.scrolled + "%" }'></div>
        </aside>
        <aside class="w-full box-border px-4 h-14 top-0 fixed flex justify-between items-center z-[90] <s_if_var_sidebar>xl:w-c</s_if_var_sidebar>" id="top" x-data="top" @scroll.window="toggle" :class='open ? "backdrop-blur bg-h-100/50 dark:bg-h-800/80" : "bg-transparent"'>

          <!-- 좌측: 프로필 이미지 (사이드바 열기) -->
          <div class="img">
            <img class="thumb lazyload rounded-full w-9 h-9 cursor-pointer object-cover <s_if_var_sidebar>xl:invisible</s_if_var_sidebar>" @click="sidebar = ! sidebar" data-src="[##_image_##]" data-sizes="auto" alt="[##_blogger_##]" width="36" height="36"
                :class="sidebar ? 'opacity-0 pointer-events-none' : 'opacity-100'">          </div>
          <!-- 중앙: 기본 페이지 타이틀 (온보딩 비활성 시) -->
          <div class="tit max-w-[calc(80vw-152px)] h-5" id="top-title" x-show="open" x-transition:enter="transition ease-linear duration-100" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-linear duration-100" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0">
            <div class="txt m-0 text-overflow-hidden text-sm font-bold text-h-800 dark:text-h-200">[##_page_title_##]</div>
          </div>

          <!-- 우측: 구독 버튼 -->
          <div class="menu_toolbar" id="menu-toolbar" x-data="menuToolbar">
            <template x-data="subscribe" x-if="canSubscribe">
              <button class="subscribe btn_subscription" :data-blog-id="T.config.BLOG.id" :data-url="TistoryBlog.tistoryUrl">
                <span class="txt text-hidden">구독하기</span>
                <i class="ico fa-solid fa-star"></i>
              </button>
            </template>
          </div>

        </aside>
        <aside class="flex justify-end px-4 w-full box-border fixed text-sm z-[90] bottom-3 <s_if_var_sidebar>xl:w-c</s_if_var_sidebar>" id="bottom" x-data="bottom">
          <div class="wrap flex gap-x-2.5"><button class="theme btn" @click="toggleTheme"><span class="txt">테마</span><i class="ico fa-solid fa-moon"></i></button><a class="top btn" href="#hELLO"><span class="txt">상단으로</span><i class="ico fa-solid fa-chevron-up"></i></a></div>
        </aside>
      </div>
    </s_t3>
